name: _Packaged E2E (reusable)

# B4 items 2-3: the COMPOSED proof gate. A real browser (Playwright's Chromium) loads the playground
# (built against the SDK) and drives the INSTALLED desktop app to a native `bb` proof over HTTPS, with
# HTTP-downgrade + WASM-fallback disabled. The decisive assertion lives in the spec
# (`packages/playground/e2e/accelerator.packaged-e2e.spec.ts`): a 200 https://127.0.0.1:59834/prove carrying
# `x-prove-duration-ms` (the server emits it only after a real bb::prove).
#
# Trust is seeded OUT-OF-BAND (the app's own enable_https install is interactive; see b4-impl.md): here on
# Linux via `certutil` into the user NSS DB that Chromium reads. The app serves HTTPS trust-decoupled on Linux
# (main.rs), so the seed is purely for the browser fetch.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout
        required: false
        type: string
        default: ""
      app_artifact:
        description: Name of the uploaded Linux installer artifact (contains the .deb)
        required: false
        type: string
        default: accelerator-linux-x86_64
      macos_app_artifact:
        description: Name of the uploaded macOS arm64 installer artifact (contains the .dmg)
        required: false
        type: string
        default: accelerator-macos-arm64
      aztec_node_url:
        description: Aztec node URL (skips local CLI install when not localhost)
        required: false
        type: string
        default: "http://localhost:8080"
      prev_stable_tag:
        description: The N-1 stable release tag for the 1.0.7→2.0.0 upgrade leg (its .deb is downloaded)
        required: false
        type: string
        default: accelerator-v1.0.7
      release_tag:
        description: >-
          When set, download the app installers from THIS release's OWN assets (the draft-gate: prove the
          real uploaded bytes) via `gh release download` instead of the run's build artifacts. Empty ⇒
          build-artifact mode (PR gate / standalone).
        required: false
        type: string
        default: ""

jobs:
  # Draft-gate privilege isolation (codex): a DRAFT release's assets are only visible to a WRITE-level token,
  # but the E2E jobs below execute the installed app + a browser + the packed SDK, so they must NOT hold one.
  # THIS job is the sole holder of `contents: write` — it takes NO checkout and runs NO downloaded/app code:
  # it only fetches the draft's own release-named installers (+ the gated manifest), verifies them, and
  # re-uploads them as one immutable artifact the read-only E2E jobs consume. It always runs (build-artifact
  # mode just re-stages the run's build artifacts) so the E2E `needs` is always satisfied without always()-gating.
  stage-installers:
    name: Stage installers (privileged fetch, no code execution)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the draft's own installers (release-asset mode)
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p app-artifact
          # One pattern per OS leg. The Windows NSIS setup feeds the windows legs; the build-artifact-mode
          # glob below (`accelerator-*x86_64`) already matches the windows build artifact, so this
          # release-asset list is the only place the Windows installer had to be added.
          gh release download "$TAG" --repo "$REPO" \
            --pattern '*Linux-x86_64.deb' --pattern '*macOS-Apple-Silicon.dmg' \
            --pattern '*Windows-x86_64-setup.exe' --dir app-artifact
      - name: Fetch the gated manifest (release-asset mode)
        if: inputs.release_tag != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-asset-manifest
          path: manifest
      - name: Verify the draft bytes against the gated manifest (release-asset mode)
        if: inputs.release_tag != ''
        run: |
          # Inline (this job takes NO checkout, so it cannot run the repo verify script): exact filename match
          # + sha256, the same rule as .github/scripts/packaged-e2e-verify-manifest.sh — which the E2E jobs
          # re-run against this same artifact after their checkout (defence in depth).
          set -euo pipefail
          MANIFEST="manifest/asset-manifest.sha256"
          test -f "$MANIFEST" || { echo "::error::gated manifest not found"; exit 1; }
          shopt -s nullglob
          cd app-artifact
          staged=(*)
          [ ${#staged[@]} -gt 0 ] || { echo "::error::no draft installer downloaded to stage"; exit 1; }
          for f in "${staged[@]}"; do
            line="$(awk -v want="$f" '$2 == want {print; found=1} END {exit !found}' "../$MANIFEST")" \
              || { echo "::error::$f is not in the gated manifest — refusing"; exit 1; }
            echo "$line" | sha256sum -c -
          done
          echo "Staged draft installers verified against the gated manifest"
      - name: Re-stage the run's build installers (build-artifact mode)
        if: inputs.release_tag == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: accelerator-*x86_64
          path: app-artifact
          merge-multiple: true
      - name: Upload the staged installers (+ manifest) for the read-only E2E jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staged-installers
          path: |
            app-artifact
            manifest
          if-no-files-found: warn
          retention-days: 1

  packaged-e2e-linux:
    name: Packaged E2E (linux)
    needs: stage-installers
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read # consumes the staged-installers artifact; the draft fetch's write token stays in staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-aztec
        with:
          skip_cli: ${{ inputs.aztec_node_url != 'http://localhost:8080' }}

      # Restore the headless-shell browser from the cache warmed on main (flaky CDN otherwise).
      - uses: ./.github/actions/playwright-cache

      - uses: ./.github/actions/start-services
        with:
          aztec_node_url: ${{ inputs.aztec_node_url }}

      # The packaged app is a system-tray GUI (GTK/WebKit). On a headless runner it needs a virtual display,
      # a tray host, and a dbus session — same recipe as the WebDriver E2E leg. libnss3-tools gives us
      # `certutil` for the browser-trust seed.
      - name: Virtual display + tray + trust tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb stalonetray dbus-x11 libnss3-tools
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Let Xvfb come up, then start a system-tray host so the app's tray icon has somewhere to attach
          # (the app is a tray app — without a host it can fail to finish bring-up). Same recipe as the
          # WebDriver E2E leg. DISPLAY is set inline here because $GITHUB_ENV only applies to LATER steps.
          sleep 2
          DISPLAY=:99 stalonetray >/tmp/stalonetray.log 2>&1 &

      # The privileged stage-installers job fetched + verified the draft's own installers (+ manifest) with the
      # only write token; this read-only job consumes the staged artifact (restores app-artifact/ + manifest/),
      # then re-verifies below.
      - name: Download the staged installers (+ manifest)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: staged-installers

      - name: Verify installer bytes against the gated manifest (release-asset mode)
        if: inputs.release_tag != ''
        run: bash .github/scripts/packaged-e2e-verify-manifest.sh

      - name: Install the .deb
        run: |
          DEB=$(find app-artifact -name '*.deb' | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb found in artifact '${{ inputs.app_artifact }}'"
            ls -laR app-artifact
            exit 1
          fi
          echo "Installing $DEB"
          # apt-get resolves the .deb's own GTK/WebKit runtime deps (dpkg -i would not).
          sudo apt-get install -y "./$DEB"

      # ── Bootstrap: generate the app's real CA headlessly (no interactive trust install), then seed it
      #    into the browser's NSS store out-of-band. See --generate-certs-only in src-tauri/main.rs. ──
      - name: Generate certs (headless bootstrap)
        run: AztecAccelerator --generate-certs-only

      - name: Seed CA into user NSS (browser trust)
        run: |
          CA="$HOME/.aztec-accelerator/certs/ca.pem"
          test -f "$CA" || { echo "::error::$CA not generated"; exit 1; }
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb" 2>/dev/null || true
          certutil -A -t "C,," -n aztec-accel-e2e-ca -d "sql:$HOME/.pki/nssdb" -i "$CA"
          certutil -L -d "sql:$HOME/.pki/nssdb"

      - name: Write config (HTTPS on, localhost auto-approved)
        run: |
          mkdir -p "$HOME/.aztec-accelerator"
          # auto_approve_localhost:true auto-approves the localhost:5173 page (no /prove auth popup needed —
          # the headless GUI has no popup surface). config_version:2 matches the v2 schema (B4 item 1).
          printf '%s' '{"config_version":2,"https_enabled":true,"auto_approve_localhost":true}' \
            > "$HOME/.aztec-accelerator/config.json"

      - name: Launch the installed app + wait for HTTPS
        run: |
          dbus-launch AztecAccelerator >/tmp/accel.log 2>&1 &
          echo "ACCEL_PID=$!" >> "$GITHUB_ENV"
          # -k here only proves the app is SERVING TLS; the real trust check is the browser's fetch in the spec.
          for i in $(seq 1 45); do
            if curl -ksf https://127.0.0.1:59834/health >/dev/null 2>&1; then
              echo "App serving HTTPS on :59834 (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App did not serve HTTPS within 90s"
          cat /tmp/accel.log 2>/dev/null || true
          exit 1

      # Point the playground at the PACKED SDK tarball (not the workspace source), so the composed proof
      # exercises the PUBLISHED artifact — the brief's "packed SDK" requirement (codex harness review).
      - name: Pack the SDK + install the tarball into the playground
        run: bash .github/scripts/packaged-e2e-swap-sdk.sh

      - name: Run packaged-E2E (composed proof)
        env:
          AZTEC_NODE_URL: ${{ inputs.aztec_node_url }}
        run: bun run --cwd packages/playground test:e2e:packaged

      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-e2e-linux-logs
          path: |
            /tmp/accel.log
            /tmp/xvfb.log
            /tmp/aztec-node.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: kill "$ACCEL_PID" 2>/dev/null || true

  packaged-e2e-macos:
    name: Packaged E2E (macos)
    needs: stage-installers
    runs-on: macos-latest
    timeout-minutes: 55
    permissions:
      contents: read # consumes the staged-installers artifact; the draft fetch's write token stays in staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-aztec
        with:
          skip_cli: ${{ inputs.aztec_node_url != 'http://localhost:8080' }}

      # The playwright-cache action is Linux-only (GNU `timeout`), so install the browser directly on macOS.
      - name: Install Playwright browser
        run: bunx playwright install chromium

      - uses: ./.github/actions/start-services
        with:
          aztec_node_url: ${{ inputs.aztec_node_url }}

      # Consume the privileged stage-installers artifact (restores app-artifact/ + manifest/), then re-verify.
      - name: Download the staged installers (+ manifest)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: staged-installers

      - name: Verify installer bytes against the gated manifest (release-asset mode)
        if: inputs.release_tag != ''
        run: bash .github/scripts/packaged-e2e-verify-manifest.sh

      # Install to /Applications (a real installed copy), not run-from-DMG — the composed gate should exercise
      # the installed state (paths, autostart) the way a user gets it (codex harness review).
      - name: Install the .app to /Applications
        run: |
          DMG=$(find app-artifact -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg found in artifact '${{ inputs.macos_app_artifact }}'"
            ls -laR app-artifact
            exit 1
          fi
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/AztecAccelerator
          APP=$(find /Volumes/AztecAccelerator -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "::error::.app not found in DMG"; find /Volumes/AztecAccelerator -type f; exit 1; }
          cp -R "$APP" /Applications/
          hdiutil detach /Volumes/AztecAccelerator || true
          # Our .app's Contents/MacOS/ holds BOTH the main app (AztecAccelerator — the renamed cargo [[bin]],
          # the one that has --generate-certs-only) AND the bundled `bb` prover sidecar, so a first-executable
          # `find | head -1` grabbed `bb` (whose clap parser rejects the flag, exit 109). Address the main
          # binary BY NAME. The .app dir is <productName>.app ("Aztec Accelerator.app"); the binary is the bin.
          APP_NAME=$(basename "$APP")
          BIN="/Applications/$APP_NAME/Contents/MacOS/AztecAccelerator"
          test -x "$BIN" || { echo "::error::main app binary not found at $BIN"; ls -la "/Applications/$APP_NAME/Contents/MacOS" 2>/dev/null; exit 1; }
          echo "APP_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Generate certs (headless bootstrap)
        run: '"$APP_BIN" --generate-certs-only'

      # macOS: the app's LAUNCH gates on trust (unlike Linux), so seed the System keychain BEFORE launch.
      # `security add-trusted-cert -d` writes the admin/System domain (GH runners have passwordless sudo);
      # the app's predicate `security verify-cert -l -L` reads the default search list (incl. System), and
      # Playwright's Chromium on macOS honours the System keychain for the browser fetch too.
      - name: Seed CA into the System keychain (app + browser trust)
        run: |
          CA="$HOME/.aztec-accelerator/certs/ca.pem"
          test -f "$CA" || { echo "::error::$CA not generated"; exit 1; }
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$CA"
          # Fail loudly here (not later with a mysterious TLS error) if the seed did not take — this is the
          # macOS empirical unknown (codex): sudo on a newer TCC-tightened runner could refuse.
          security verify-cert -l -L -c "$CA" || { echo "::error::CA not trusted after System-keychain seed"; exit 1; }

      - name: Write config (HTTPS on, localhost auto-approved)
        run: |
          mkdir -p "$HOME/.aztec-accelerator"
          printf '%s' '{"config_version":2,"https_enabled":true,"auto_approve_localhost":true}' \
            > "$HOME/.aztec-accelerator/config.json"

      - name: Launch the installed app + wait for HTTPS
        run: |
          "$APP_BIN" >/tmp/accel.log 2>&1 &
          echo "ACCEL_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 45); do
            if curl -ksf https://127.0.0.1:59834/health >/dev/null 2>&1; then
              echo "App serving HTTPS on :59834 (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App did not serve HTTPS within 90s"
          cat /tmp/accel.log 2>/dev/null || true
          exit 1

      - name: Pack the SDK + install the tarball into the playground
        run: bash .github/scripts/packaged-e2e-swap-sdk.sh

      - name: Run packaged-E2E (composed proof)
        env:
          AZTEC_NODE_URL: ${{ inputs.aztec_node_url }}
        run: bun run --cwd packages/playground test:e2e:packaged

      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-e2e-macos-logs
          path: |
            /tmp/accel.log
            /tmp/aztec-node.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        # Best-effort teardown of what the harness planted (the composed-proof gate is step 14, above). On a
        # headless macOS runner `security remove-trusted-cert -d` (System domain) can block on an auth prompt
        # with no one to answer it — it hung a PASSING run to the 55-min job timeout, cancelling an
        # already-green leg. Bound the step and never let a stuck teardown fail it (the runner is ephemeral, so
        # a lingering seed is harmless).
        timeout-minutes: 3
        continue-on-error: true
        run: |
          kill "$ACCEL_PID" 2>/dev/null || true
          CA="$HOME/.aztec-accelerator/certs/ca.pem"
          if [ -f "$CA" ]; then
            sudo security remove-trusted-cert -d "$CA" 2>/dev/null || true
          fi
          hdiutil detach /Volumes/AztecAccelerator 2>/dev/null || true

  # E: prove item-1's config migration on a REAL 1.0.7→2.0.0 upgrade (not just the unit test). A 1.0.7-shaped
  # config (legacy `safari_support`, no `config_version`) must, after the in-place upgrade + first launch,
  # migrate + PERSIST on disk: `config_version:2`, `safari_support` removed, origins preserved. (The persist
  # happens via the launch-time MissingCertsReset save — see main.rs; `https_enabled` resets to false without
  # certs, which is expected and not asserted here.)
  upgrade-migration-linux:
    name: 1.0.7 upgrade + config migration (linux)
    needs: stage-installers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # the N-1 (1.0.7) is a PUBLISHED release (read-ok); the 2.0.0 draft comes via staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Virtual display + tray
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb stalonetray dbus-x11
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
          DISPLAY=:99 stalonetray >/tmp/stalonetray.log 2>&1 &

      - name: Download N-1 (1.0.7) installer
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ inputs.prev_stable_tag }}
        run: gh release download "$PREV_TAG" --pattern '*.deb' --dir prev

      # The 2.0.0 draft installer comes via the privileged stage-installers artifact (restores app-artifact/ +
      # manifest/); this read-only job re-verifies below. (The N-1 1.0.7 .deb was fetched above from its
      # PUBLISHED release, which read perms can see.)
      - name: Download the staged installers (+ manifest)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: staged-installers

      - name: Verify installer bytes against the gated manifest (release-asset mode)
        if: inputs.release_tag != ''
        run: bash .github/scripts/packaged-e2e-verify-manifest.sh

      - name: Install 1.0.7 + write a 1.0.7-shaped config
        run: |
          PREV_DEB=$(find prev -name '*.deb' | head -1)
          test -n "$PREV_DEB" || { echo "::error::no 1.0.7 .deb"; ls -laR prev; exit 1; }
          sudo apt-get install -y "./$PREV_DEB"
          mkdir -p "$HOME/.aztec-accelerator"
          # 1.0.7 schema: legacy `safari_support`, NO `config_version`, plus a marker origin to prove survival.
          printf '%s' '{"safari_support":true,"approved_origins":["http://preserved.example"]}' \
            > "$HOME/.aztec-accelerator/config.json"

      - name: Upgrade to 2.0.0 in place + launch
        run: |
          NEW_DEB=$(find app-artifact -name '*.deb' | head -1)
          test -n "$NEW_DEB" || { echo "::error::no 2.0.0 .deb"; ls -laR app-artifact; exit 1; }
          sudo apt-get install -y "./$NEW_DEB"
          dbus-launch AztecAccelerator >/tmp/accel.log 2>&1 &
          echo "ACCEL_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:59833/health >/dev/null 2>&1; then
              echo "2.0.0 up after upgrade (attempt $i)"; break
            fi
            sleep 2
          done

      - name: Assert the config migrated + survived on disk
        run: |
          CFG="$HOME/.aztec-accelerator/config.json"
          # The migration persists via the launch-time reset save; poll until it lands.
          for _ in $(seq 1 15); do
            if jq -e '.config_version == 2' "$CFG" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "Post-upgrade config:"; cat "$CFG"
          jq -e '.config_version == 2' "$CFG" || { echo "::error::config_version not migrated to 2"; exit 1; }
          jq -e 'has("safari_support") | not' "$CFG" || { echo "::error::legacy safari_support not removed"; exit 1; }
          jq -e '.approved_origins | index("http://preserved.example")' "$CFG" \
            || { echo "::error::approved_origins not preserved across upgrade"; exit 1; }
          echo "OK: config_version=2, safari_support removed, origins preserved across the 1.0.7→2.0.0 upgrade"

      - name: Cleanup
        if: always()
        run: kill "$ACCEL_PID" 2>/dev/null || true

  # B5 packaged uninstall: the ownership-checked teardown runs on the INSTALLED app, then the package is
  # removed. Asserts the flow succeeds end-to-end + the binary is gone (the per-store cleanup detail is B5's
  # unit tests).
  uninstall-linux:
    name: Full uninstall (linux)
    needs: stage-installers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # consumes the staged-installers artifact; the draft fetch's write token stays in staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The 2.0.0 draft installer comes via the privileged stage-installers artifact (restores app-artifact/ +
      # manifest/); this read-only job re-verifies below.
      - name: Download the staged installers (+ manifest)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: staged-installers

      - name: Verify installer bytes against the gated manifest (release-asset mode)
        if: inputs.release_tag != ''
        run: bash .github/scripts/packaged-e2e-verify-manifest.sh

      - name: Install, prepare-uninstall, then remove the package
        run: |
          NEW_DEB=$(find app-artifact -name '*.deb' | head -1)
          test -n "$NEW_DEB" || { echo "::error::no .deb"; ls -laR app-artifact; exit 1; }
          sudo apt-get update
          sudo apt-get install -y "./$NEW_DEB"
          command -v AztecAccelerator >/dev/null || { echo "::error::binary not on PATH after install"; exit 1; }
          # The ownership-checked teardown (B5) — exits 0 on success (or a clean "another install owns it").
          AztecAccelerator --prepare-uninstall
          # Remove the package; the binary must be gone.
          PKG=$(dpkg-deb -f "$NEW_DEB" Package)
          sudo apt-get remove -y "$PKG"
          # `command -v` consults bash's PATH hash, which cached AztecAccelerator's location from the
          # post-install check above; after removal that hash is STALE and would falsely report the binary as
          # still present. Clear it so the lookup re-checks the filesystem.
          hash -r
          if command -v AztecAccelerator >/dev/null; then
            echo "::error::binary still present after package removal"; exit 1
          fi
          echo "OK: prepare-uninstall + package removal clean; binary gone"

  # Windows counterpart — deliberately DEEPER than the linux leg above. Windows is the only OS with a NATIVE
  # uninstall hook pair (NSIS PREUNINSTALL primary -> `--prepare-uninstall`; POSTUNINSTALL "belt", an
  # ownership-checked native redo), and that logic has never run end-to-end against a real install: today's
  # Windows CI proves the hooks only against a STUB exe (accelerator.yml's synthetic makensis harness) or
  # installs without ever invoking the uninstaller (accelerator.yml's windows-build). This leg closes that gap
  # — it is the "live Windows NSIS belt harness" B5 scoped as a release-gate item.
  #
  # Arming is by the PRODUCT, not by CI: `intent_enabled_now()` reads the Run-key artifact itself as the
  # source of truth (autostart.rs:1486-1491), so seeding that value is the moral equivalent of the user
  # ticking "Start on Login". The launched app then writes the derived state itself — it heals the Run value
  # to its own exactly-quoted path and arms the crash-recovery scheduled task (autostart.rs:1788-1819).
  # Everything asserted gone below is asserted PRESENT first: without that, "removed" would pass vacuously on
  # a runner where the app was never installed.
  uninstall-windows:
    name: Full uninstall (windows)
    needs: stage-installers
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read # consumes the staged-installers artifact; the draft fetch's write token stays in staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download the staged installers (+ manifest)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: staged-installers

      # Git Bash runs the same OS-agnostic verify script the linux/macos legs run (awk + sha256sum ship with
      # Git for Windows) — no Windows-specific verification path to drift.
      - name: Verify installer bytes against the gated manifest (release-asset mode)
        if: inputs.release_tag != ''
        shell: bash
        run: bash .github/scripts/packaged-e2e-verify-manifest.sh

      - name: Install the real NSIS setup, arm product state, then run the real uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runKey = "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run"
          $runValueName = "Aztec Accelerator"
          $taskName = "Aztec Accelerator Crash Recovery"
          $aztecDir = Join-Path $env:USERPROFILE ".aztec-accelerator"

          $setup = Get-ChildItem -Path app-artifact -Recurse -Filter "*-setup.exe" -EA SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            Write-Error "no Windows *-setup.exe among the staged installers"
            Get-ChildItem -Path app-artifact -Recurse | Select-Object FullName | Out-String | Write-Host
            exit 1
          }

          # The installer is unsigned (B1 Authenticode is still deferred); a Defender quarantine mid-run would
          # masquerade as a product failure. Scoped to the per-user install target on an ephemeral runner.
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA" -ErrorAction SilentlyContinue

          # NSIS /S is ASYNC: -PassThru + WaitForExit so a (never-expected) interactive prompt fails fast here
          # instead of hanging the job to its timeout.
          Write-Host "installing $($setup.FullName) /S"
          $inst = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru
          if (-not $inst.WaitForExit(180000)) {
            $inst.Kill()
            Write-Error "installer did not finish within 180s — an interactive NSIS prompt would hang the runner"
            exit 1
          }

          # Address the app BY NAME under the per-user install root (installMode currentUser). Never a bare
          # recursive first-match on the directory: the install dir also carries the bundled `bb` sidecar.
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA" -Recurse -Filter "AztecAccelerator.exe" -EA SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "installed AztecAccelerator.exe not found under %LOCALAPPDATA%"; exit 1 }
          $installDir = $exe.Directory.FullName
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller)) { Write-Error "no uninstall.exe in $installDir"; exit 1 }
          Write-Host "installed to $installDir"

          # Cert MATERIAL on disk (headless-safe: generates the CA/leaf/key, never touches the OS trust store,
          # which is the same call the linux/macos legs use). This is what `--prepare-uninstall` must delete.
          # POLL, don't test once: this is a GUI-subsystem binary, so the call returns as soon as it detaches
          # and the certs land via a staged write + atomic rename — a single immediate Test-Path loses the race.
          $certsDir = Join-Path $aztecDir "certs"
          $caFile = Join-Path $certsDir "ca.pem"
          & $exe.FullName --generate-certs-only
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path $caFile) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $caFile)) {
            Get-ChildItem -Path $aztecDir -Recurse -EA SilentlyContinue | Select-Object FullName | Out-String | Write-Host
            Write-Error "precondition: --generate-certs-only produced no ca.pem within 30s"
            exit 1
          }

          # A config file that must SURVIVE the uninstall (documented retention: config + bb cache are never
          # touched — README "Your config and approved origins are never touched").
          $configFile = Join-Path $aztecDir "config.json"
          Set-Content -Path $configFile -NoNewline -Value '{"config_version":2,"approved_origins":["http://uninstall.example"]}'

          # Seed INTENT (= the user's "Start on Login" tick). The product derives the rest on launch.
          Set-ItemProperty -Path $runKey -Name $runValueName -Value "$env:LOCALAPPDATA\Aztec Stale\Aztec Accelerator.exe "
          schtasks /Delete /TN $taskName /F 2>$null | Out-Null

          $env:AZTEC_ACCEL_NO_UPDATE = "1"
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              if ((Invoke-RestMethod -Uri "http://127.0.0.1:59833/health" -TimeoutSec 3).status -eq "ok") { $healthy = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $healthy) { Write-Error "installed app did not serve /health within 60s"; exit 1 }

          # ── PRECONDITIONS: everything asserted gone later must be observably present NOW. ──
          $expectedRun = '"' + $exe.FullName + '"'
          $armedRun = $null
          $deadline = (Get-Date).AddSeconds(20)
          do {
            $armedRun = (Get-ItemProperty -Path $runKey -Name $runValueName -EA SilentlyContinue).$runValueName
            if ($armedRun -ceq $expectedRun) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if ($armedRun -cne $expectedRun) {
            Write-Error "precondition: the product did not heal the Run value to its own quoted path (got '$armedRun')"
            exit 1
          }
          schtasks /Query /TN $taskName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "precondition: the product did not arm the crash-recovery task (intent was seeded on)"
            exit 1
          }
          Write-Host "armed by the product: healed Run value + crash-recovery task + certs on disk"

          # ── The real uninstaller, silently, with the app STILL RUNNING (what a real user does from Add/Remove
          #    Programs). PREUNINSTALL runs `--prepare-uninstall` (ownership-checked teardown), POSTUNINSTALL
          #    runs the belt. `$EXEDIR != $INSTDIR` holds because Windows copies uninstall.exe to a temp dir. ──
          $un = Start-Process -FilePath $uninstaller -ArgumentList "/S" -PassThru
          if (-not $un.WaitForExit(180000)) {
            $un.Kill()
            Write-Error "uninstaller did not finish within 180s"
            exit 1
          }
          # NSIS returns before its temp-dir copy finishes deleting $INSTDIR; give it a bounded settle.
          $gone = $false
          $deadline = (Get-Date).AddSeconds(60)
          do {
            if (-not (Test-Path $installDir)) { $gone = $true; break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)

          # ── POSTCONDITIONS ──
          $failures = @()
          if (-not $gone) { $failures += "install dir still present: $installDir" }
          $runAfter = (Get-ItemProperty -Path $runKey -Name $runValueName -EA SilentlyContinue).$runValueName
          if ($null -ne $runAfter) { $failures += "autostart Run value survived: '$runAfter'" }
          schtasks /Query /TN $taskName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $failures += "crash-recovery scheduled task survived" }
          if (Test-Path $certsDir) { $failures += "certs dir survived: $certsDir" }
          # Retention is as load-bearing as removal: an uninstall that eats the user's config is a data-loss bug.
          if (-not (Test-Path $configFile)) { $failures += "config.json was deleted (documented retention says it is never touched)" }
          # The PT1M crash-recovery trigger is exactly why "no orphan" needs a wait, not an instant check:
          # a surviving task would relaunch the app within ~1 minute of it going away.
          Start-Sleep -Seconds 75
          $alive = Get-Process -Name "AztecAccelerator" -EA SilentlyContinue
          if ($alive) { $failures += "an AztecAccelerator process is running 75s after uninstall (resurrected by a surviving task?)" }
          if (Test-Path $installDir) { $failures += "install dir reappeared after the crash-recovery window" }

          if ($failures.Count -gt 0) {
            foreach ($f in $failures) { Write-Host "::error::$f" }
            Write-Error "uninstall left $($failures.Count) artifact(s) behind"
            exit 1
          }
          Write-Host "OK: real NSIS uninstall removed install dir + autostart + crash-recovery task + certs, kept config, and nothing came back"
          exit 0

      # Mirrors the macOS leg's hardening: a cleanup that blocks must never burn a PASSING run to the job
      # timeout. Disarm the recovery task BEFORE any force-kill, or Task Scheduler treats the kill as a crash
      # and relaunches the app mid-teardown.
      - name: Cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          schtasks /Delete /TN "Aztec Accelerator Crash Recovery" /F 2>$null | Out-Null
          Remove-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" -Name "Aztec Accelerator" -ErrorAction SilentlyContinue
          Get-Process -Name "AztecAccelerator" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0
