name: _Publish SDK (reusable)

# Intentionally call-only. npm trusted publishing authenticates the top-level
# `.github/workflows/release-sdk.yml` workflow in the `npm-publish` environment.
on:
  workflow_call:
    outputs:
      sdk_version:
        description: "The SDK version published to npm testnet"
        value: ${{ jobs.publish.outputs.sdk_version }}

jobs:
  publish:
    name: Publish SDK candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      id-token: write
      contents: write
    outputs:
      sdk_version: ${{ steps.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require an npm CLI with trusted-publishing support
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major=0,minor=0,patch=0]=process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version" || {
            echo "::error::npm 11.5.1 or newer is required for trusted publishing (got $npm_version)"
            exit 1
          }
          echo "npm $npm_version"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/sdk build

      - name: Read Aztec version
        id: aztec-version
        working-directory: packages/sdk
        run: |
          version=$(node -p "require('./package.json').dependencies['@aztec/stdlib']")
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::@aztec/stdlib not found in packages/sdk/package.json dependencies"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine SDK publish version
        id: sdk-version
        env:
          AZTEC_VERSION: ${{ steps.aztec-version.outputs.version }}
        run: |
          version=$(bun scripts/get-sdk-publish-version.ts "$AZTEC_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SDK candidate: $version"

      - name: Fail closed if npm, git, or GitHub already contains the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sdk-version.outputs.version }}
        run: |
          package='@alejoamiras/aztec-accelerator'
          tag="${package}@${VERSION}"
          encoded_tag="$(jq -rn --arg tag "$tag" '$tag | @uri')"

          versions="$(npm view "$package" versions --json)"
          if printf '%s' "$versions" | jq -e --arg version "$VERSION" 'if type == "array" then index($version) != null else . == $version end' >/dev/null; then
            echo "::error::$package@$VERSION already exists on npm"
            exit 1
          fi

          remote_refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$remote_refs" ]; then
            echo "::error::git tag $tag already exists on origin"
            exit 1
          fi

          release_status="$(curl -sS -o "$RUNNER_TEMP/sdk-release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag")"
          case "$release_status" in
            404) ;;
            200) echo "::error::GitHub release $tag already exists"; exit 1 ;;
            *) echo "::error::GitHub release preflight returned HTTP $release_status"; exit 1 ;;
          esac

      - name: Prepare and pack the exact publish artifact
        working-directory: packages/sdk
        env:
          VERSION: ${{ steps.sdk-version.outputs.version }}
        run: |
          bun ../../scripts/prepare-sdk-publish.ts "$VERSION"
          tarball="$PWD/$(npm pack --silent)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "Packed $tarball"

      - name: Test the exact publish artifact as an npm consumer
        run: bash scripts/sdk-tarball-consumer.sh "$TARBALL"

      - name: Publish candidate to npm testnet with OIDC
        # npm exchanges GitHub's OIDC identity through the configured trusted publisher.
        # Do not add a traditional token fallback to this run.
        run: npm publish "$TARBALL" --provenance --access public --tag testnet --workspaces=false

      - name: Verify npm version, testnet tag, and provenance
        env:
          VERSION: ${{ steps.sdk-version.outputs.version }}
        run: |
          package='@alejoamiras/aztec-accelerator'
          for attempt in $(seq 1 10); do
            published="$(npm view "$package@$VERSION" version 2>/dev/null || true)"
            testnet="$(npm view "$package" dist-tags.testnet 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ] && [ "$testnet" = "$VERSION" ] && \
               bun scripts/sdk-release-verification.ts "$VERSION" "$GITHUB_SHA"; then
              exit 0
            fi
            echo "Registry/provenance not consistent yet (attempt $attempt/10)"
            sleep 6
          done
          echo "::error::npm publish could not be verified"
          exit 1

      - name: Cryptographically verify registry signatures and provenance
        env:
          VERSION: ${{ steps.sdk-version.outputs.version }}
        run: bun scripts/verify-sdk-package-signatures.ts "$VERSION"

      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sdk-version.outputs.version }}
          AZTEC_VERSION: ${{ steps.aztec-version.outputs.version }}
        run: |
          tag="@alejoamiras/aztec-accelerator@${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

          if [ "$VERSION" = "$AZTEC_VERSION" ]; then
            notes="Aligned with Aztec testnet version \`$AZTEC_VERSION\`."
          else
            notes="SDK revision for Aztec testnet version \`$AZTEC_VERSION\`."
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes "$notes" \
            --latest=false \
            packages/sdk/MIGRATION.md

      - name: Verify release records and a fresh registry install
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sdk-version.outputs.version }}
        run: |
          package='@alejoamiras/aztec-accelerator'
          tag="${package}@${VERSION}"
          remote_refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          remote_sha="$(printf '%s\n' "$remote_refs" | awk '/\^\{\}$/ {print $1; exit}')"
          [ -z "$remote_sha" ] && remote_sha="$(printf '%s\n' "$remote_refs" | awk 'NR==1 {print $1}')"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "::error::remote tag resolves to $remote_sha, expected $GITHUB_SHA"
            exit 1
          fi
          gh release view "$tag" --json tagName --jq '.tagName' | grep -Fx "$tag"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --loglevel=error "$package@$VERSION"
          installed="$(node -p "require('./node_modules/@alejoamiras/aztec-accelerator/package.json').version")"
          [ "$installed" = "$VERSION" ] || {
            echo "::error::fresh install resolved $installed, expected $VERSION"
            exit 1
          }
          echo "Verified $package@$VERSION; npm latest remains unchanged."
