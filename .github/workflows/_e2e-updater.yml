name: _Updater Smoke (reusable)

# Release-time gate: install the previous stable (N-1), let it auto-update to
# the just-built+signed build (N) via a local feed impersonating the prod
# endpoint, and assert it relaunches reporting version N. Reproduces the 1.0.1
# failure class (macOS amfid hang after the in-place .app swap). macOS only in
# this first increment; Linux (AppImage) + a standing negative test land in a
# follow-up once this is proven on a 1.0.3-rc dry-run.
#
# Needs no signing key: it serves the already-prod-signed N artifact and N-1
# validates it against its embedded pubkey. See updater-smoke.sh.

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner (macos-latest | macos-15-intel)
        required: true
        type: string
      platform-key:
        description: Tauri updater platform key (darwin-aarch64 | darwin-x86_64)
        required: true
        type: string
      n-version:
        description: The version being released (N)
        required: true
        type: string
      n-artifact:
        description: This run's build artifact name (e.g. accelerator-macos-arm64)
        required: true
        type: string
      n1-dmg-glob:
        description: Glob for the N-1 release DMG asset (e.g. *macOS-Apple-Silicon.dmg)
        required: true
        type: string
      mode:
        description: "positive (expect the update to apply) | negative (serve a tampered tarball, expect rejection)"
        required: false
        default: positive
        type: string
    secrets:
      # F-004: a C4+ N-1 enforces the signed-manifest envelope, so the smoke feed must be signed with
      # the prod updater key (which the synthetic/real N-1 embeds). Same key the build job uses.
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

jobs:
  updater-smoke:
    name: Updater Smoke
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # REQUIRED for sign-smoke-feed.sh: it runs `bunx tauri signer sign`, which only resolves the
      # LOCAL @tauri-apps/cli (a devDependency of packages/accelerator). Without an install, bunx
      # falls back to fetching an npm package literally named `tauri` — which has no executable, so
      # the smoke dies with "could not determine executable to run for package tauri". The Windows
      # smoke never hit this because it uses ./.github/actions/setup-accelerator, which installs.
      - name: Install dependencies (provides @tauri-apps/cli for feed signing)
        run: bun install --frozen-lockfile

      - name: Download N artifacts (this run)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.n-artifact }}
          path: n-artifacts

      - name: Download latest stable (N-1) DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N_VERSION: ${{ inputs.n-version }}
        run: |
          N1_TAG=$(gh release list --exclude-pre-releases --limit 20 --json tagName --jq '[.[].tagName | select(startswith("accelerator-v"))][0]')
          if [ -z "$N1_TAG" ]; then
            echo "::error::no stable release found to use as N-1"
            exit 1
          fi
          echo "N-1 = $N1_TAG"
          # Guard against a no-op pass: if N-1 resolves to the SAME version under
          # test (e.g. a re-run after N is already the latest stable), the updater
          # has nothing to do and `/health == N` would pass trivially (false pass).
          # Exact tag compare (tags are `accelerator-v<version>`) — a suffix match
          # would false-trip on e.g. accelerator-v11.0.3 vs 1.0.3.
          if [ "$N1_TAG" = "accelerator-v$N_VERSION" ]; then
            echo "::error::N-1 ($N1_TAG) is the version under test (accelerator-v$N_VERSION) — no-op no-update would pass trivially. Aborting."
            exit 1
          fi
          # Retry the N-1 asset download: GitHub's release-asset CDN throttles/errors transiently (the
          # 2026-08-17 incident hit it at ~50%, failing THIS unretried step on 3 straight RC dispatches).
          # `gh release download` streams to the final path with O_TRUNC and verifies neither length nor
          # digest — a transport error exits non-zero (→ retry) but a premature "clean" close could exit 0
          # with a truncated file, so each success is integrity-checked against the asset's API sha256 digest
          # (exact byte size as fallback for a release without one). 5 attempts, linear backoff; partials
          # cleared between tries. bash runs -eo pipefail by default, so every branch uses if/then/fi.
          for attempt in 1 2 3 4 5; do
            rm -rf n1; mkdir -p n1
            ok=""
            if gh release download "$N1_TAG" --pattern "${{ inputs.n1-dmg-glob }}" --dir n1; then
              f=$(find n1 -type f | head -1); bn=$(basename "${f:-x}")
              want=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$N1_TAG" --jq ".assets[]|select(.name==\"$bn\")|.digest // empty" 2>/dev/null || true)
              if [ -n "$f" ] && [ -n "$want" ]; then
                if [ "sha256:$(shasum -a 256 "$f" | cut -d' ' -f1)" = "$want" ]; then ok=1; fi
              elif [ -n "$f" ]; then
                sz=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$N1_TAG" --jq ".assets[]|select(.name==\"$bn\")|.size" 2>/dev/null || true)
                if [ -n "$sz" ] && [ "$(wc -c < "$f" | tr -d ' ')" = "$sz" ]; then ok=1; fi
              fi
            fi
            if [ -n "$ok" ]; then break; fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::N-1 download failed or failed integrity after 5 attempts (file='${f:-}')"
              exit 1
            fi
            echo "::warning::N-1 download attempt $attempt not OK; retrying in $((attempt * 10))s"
            sleep "$((attempt * 10))"
          done

      - name: Updater smoke (install N-1 → auto-update to N → assert /health == N)
        env:
          UPDATER_SMOKE_MODE: ${{ inputs.mode }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          DMG=$(find n1 -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then echo "::error::N-1 DMG not found"; exit 1; fi
          bash packages/accelerator/scripts/updater-smoke.sh \
            "${{ inputs.n-version }}" \
            "${{ inputs.platform-key }}" \
            n-artifacts \
            "$DMG" \
            "$GITHUB_WORKSPACE"
