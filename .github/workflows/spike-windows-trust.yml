name: SPIKE — Windows uninstall proof + trust probe (TEMPORARY, delete before merge)

# Two throwaway probes that cannot run any other way, because `release-accelerator.yml` refuses to run from a
# non-main ref by design (F-005: gate all side effects on a main-ref check) and it is the ONLY caller of
# `_e2e-packaged.yml`. Without this, the new Windows leg could first be exercised only AFTER it was merged
# and already release-blocking.
#
#   1. `uninstall` — runs the EXACT script the release leg runs
#      (.github/scripts/packaged-e2e-uninstall-windows.ps1) against the real PUBLISHED 2.0.0 installer.
#   2. `trust` — measures whether `certutil -user -store Root` (what the shipped HTTPS launch gate queries)
#      sees a LocalMachine-imported anchor. RESULT: it does not; see lessons/phase-1.md.
#
# Deleted in the PR that consumes the answers.
on:
  push:
    branches: [worktree-windows-packaged-e2e]
    paths: [".github/workflows/spike-windows-trust.yml", ".github/scripts/packaged-e2e-uninstall-windows.ps1"]

permissions:
  contents: read

jobs:
  uninstall:
    name: Uninstall proof against the published 2.0.0 installer
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download the real published Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p app-artifact
          gh release download accelerator-v2.0.0 --repo "$REPO" --pattern '*Windows-x86_64-setup.exe' --dir app-artifact
          ls -l app-artifact

      # The SAME script the release leg invokes — this is what makes the probe meaningful rather than a
      # parallel reimplementation that could drift from the thing being shipped.
      - name: Run the uninstall proof
        shell: pwsh
        run: .github/scripts/packaged-e2e-uninstall-windows.ps1 -AppArtifactDir app-artifact

      - name: Cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          schtasks /Delete /TN "Aztec Accelerator Crash Recovery" /F 2>$null | Out-Null
          Remove-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" -Name "Aztec Accelerator" -EA SilentlyContinue
          Get-Process -Name "AztecAccelerator" -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
          exit 0
