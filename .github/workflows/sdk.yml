name: SDK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, security-hardening]

permissions:
  contents: read

# Cancel a superseded in-flight run when a new commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/sdk/**'
              - 'scripts/**'
              - 'tsconfig.json'
              - 'tsconfig.scripts.json'
              - 'biome.json'
              - 'package.json'
              - 'bun.lock'
              # bunfig.toml gates the @aztec min-age excludes parity test (scripts/
              # bunfig-aztec-excludes.test.ts, runs in Unit Tests via test:scripts) — a
              # bunfig-only exemption edit must not skip the guard that reviews it.
              - 'bunfig.toml'
              - '.github/workflows/sdk.yml'
              - '.github/workflows/_e2e.yml'
              - '.github/actions/setup-aztec/**'
              - '.github/actions/start-services/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/sdk test:lint

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/sdk test:unit
      # Release tooling (bump/publish-version scripts) rides the SDK pipeline.
      # Typecheck too: Bun's test transpile accepts type errors tsc rejects.
      - run: bun run test:scripts
      - run: bun run typecheck:scripts

  # B7: nothing else validates the PUBLISHED artifact. The playground consumes the SDK via `workspace:*`
  # (the source `exports`), so a broken `dist` `main`/`types`/`exports` rewrite, a missing dist, or a
  # peers-vs-deps resolution surprise would ship undetected. This job packs the real tarball (via the same
  # `prepare-sdk-publish.ts` the publish workflow runs), installs it the way a real consumer does — DEFAULT
  # `npm install` on a fresh Node — and typechecks against it. It also gathers the F13 peer evidence:
  # default npm's own @aztec/stdlib graph shape for an exact-host vs a conflicting-host.
  tarball-consumer:
    name: Tarball Consumer
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Node 24 pins the npm the consumers resolve with (recorded in the log) so the peer evidence is
      # reproducible; a real consumer uses npm, not Bun.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build + pack the SDK tarball
        working-directory: packages/sdk
        run: |
          bun run build
          bun ../../scripts/prepare-sdk-publish.ts 0.0.1-tarball-ci
          echo "npm $(npm --version), node $(node --version)"
          TARBALL="$PWD/$(npm pack --silent)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "packed: $TARBALL"
      - name: Consume the tarball (exact host, default npm) — resolves + @aztec singleton
        run: bash scripts/sdk-tarball-consumer.sh "$TARBALL"

  e2e:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: ./.github/workflows/_e2e.yml
    with:
      # Build + run the headless accelerator on :59833 so the e2e exercises the NATIVE proving path
      # against the local sandbox — not just the WASM fallback. This is the standing parity gate that
      # the SDK-only release relies on (proves the deployed accelerator handles the pinned bb version).
      build_accelerator: true

  sdk-status:
    name: SDK Status
    if: always()
    needs: [changes, lint, typecheck, unit-tests, tarball-consumer, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        run: |
          results="${{ needs.changes.result }} ${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.unit-tests.result }} ${{ needs.tarball-consumer.result }} ${{ needs.e2e.result }}"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "Job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
