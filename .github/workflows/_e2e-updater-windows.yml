name: _Updater Smoke Windows (reusable)

# Windows/NSIS sibling of _e2e-updater-linux.yml. Proves the REAL prod-signed Windows artifact
# (this run's `build` output, signed with TAURI_SIGNING_PRIVATE_KEY, embedding the prod pubkey)
# installs as an auto-update — i.e. it tests what we actually ship, like mac/Linux.
#
# N    = the prod-signed `-setup.nsis.zip`/.sig downloaded from this run's `build` job.
# N-1  = the REAL previous Windows STABLE (`accelerator-v<n1-version>` release asset), the linux
#        download-real-N-1 pattern. A preflight fails early if the fixture can no longer update to
#        HEAD (asset missing, N not above the F-004 floor, updater pubkey rotated, or the feed
#        endpoint moved) — each of those would otherwise surface as a confusing smoke failure on
#        release day.
#
# workflow_call ONLY. The manual/ephemeral path (synthetic N-1 built from the current ref, both
# ends signed with a throwaway key, L8 barrier scenario) lives in smoke-updater-windows.yml — a
# SEPARATE file because a called workflow sees the CALLER's `github` context (releases are
# themselves workflow_dispatch, so an event_name split here would misroute every release), and
# because keeping the prod-secret path and the secretless path in different files is the real
# isolation boundary (piece-2 ledger A3).

on:
  workflow_call:
    inputs:
      n-version:
        description: The version being released (N) — the real build artifact's version
        required: true
        type: string
      n1-version:
        description: The REAL previous Windows stable (release tag accelerator-v<n1-version>)
        required: false
        default: "1.0.7"
        type: string
      n-artifact:
        description: This run's Windows build artifact name
        required: false
        default: accelerator-windows-x86_64
        type: string
      mode:
        description: "positive (expect the update) | negative (tamper the artifact, expect rejection)"
        required: false
        default: positive
        type: string
    secrets:
      # F-004: the real N-1 embeds the committed PROD pubkey, so the smoke feed's manifest must be
      # signed with the prod updater key.
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

jobs:
  updater-smoke-windows:
    name: Updater Smoke Windows (${{ inputs.mode }})
    runs-on: windows-latest
    timeout-minutes: 40 # no in-job build (N downloaded from this run, N-1 from the release) — bounded
    permissions:
      contents: read
    env:
      N_VERSION: ${{ inputs.n-version }}
      N1_VERSION: ${{ inputs.n1-version }}
      SMOKE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-accelerator
        with:
          rust-cache-key: accelerator-desktop-x86_64-pc-windows-msvc
          rust-workspaces: packages/accelerator/src-tauri -> target
          rust-components: ""

      # Download the REAL prod-signed N (this run's build): *-setup.nsis.zip + .sig.
      - name: Download N (prod-signed build artifact)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.n-artifact }}
          path: ${{ runner.temp }}/n-dl
      - name: Stage N updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n"
          # upload-artifact preserves the bundle/ subdir (the build's path globs span dmg/deb/
          # appimage/macos/nsis, so the common ancestor is bundle/) — the nsis files land under
          # n-dl/nsis/, not flat. Find recursively (mirrors the linux smoke's `find`), not a glob.
          nzip=$(find "$RUNNER_TEMP/n-dl" -name '*-setup.nsis.zip' | head -1)
          nsig=$(find "$RUNNER_TEMP/n-dl" -name '*-setup.nsis.zip.sig' | head -1)
          if [ -z "$nzip" ] || [ -z "$nsig" ]; then
            echo "::error::N updater artifacts (-setup.nsis.zip/.sig) not found in the build artifact"
            find "$RUNNER_TEMP/n-dl" -type f
            exit 1
          fi
          cp "$nzip" "$nsig" "$RUNNER_TEMP/n/"
          ls -la "$RUNNER_TEMP/n"

      # L8 preflight (piece-1 plan §6): every way the REAL N-1 fixture can silently rot fails HERE,
      # with a named cause, instead of as a generic smoke timeout on release day.
      - name: Download real N-1 + preflight the fixture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="accelerator-v$N1_VERSION"
          mkdir -p "$RUNNER_TEMP/n1"
          # (a) The release asset exists and downloads.
          if ! gh release download "$TAG" --pattern '*-setup.exe' --dir "$RUNNER_TEMP/n1" --repo "$GITHUB_REPOSITORY"; then
            echo "::error::preflight (a): no *-setup.exe asset on release $TAG"
            exit 1
          fi
          ls -la "$RUNNER_TEMP/n1"
          # (b) N is STRICTLY above the F-004 monotonic floor baked into N-1 (its own version) —
          # semver-aware (prerelease tags order below their release), not string/[version] compare.
          if ! bun -e "process.exit(Bun.semver.order(process.env.N_VERSION, process.env.N1_VERSION) === 1 ? 0 : 1)"; then
            echo "::error::preflight (b): N ($N_VERSION) is not semver-above N-1 ($N1_VERSION) — the real N-1's floor would reject it"
            exit 1
          fi
          # (c)+(d) The conf N-1 was BUILT with still matches HEAD where it must: same updater
          # pubkey (else N's prod signature can never verify) and the exact feed endpoint the smoke
          # impersonates (else N-1 asks a host we don't serve).
          gh api "repos/$GITHUB_REPOSITORY/contents/packages/accelerator/src-tauri/tauri.conf.json?ref=$TAG" --jq '.content' | base64 -d > "$RUNNER_TEMP/n1-conf.json"
          old_pub=$(jq -r '.plugins.updater.pubkey' "$RUNNER_TEMP/n1-conf.json")
          new_pub=$(jq -r '.plugins.updater.pubkey' packages/accelerator/src-tauri/tauri.conf.json)
          if [ "$old_pub" != "$new_pub" ]; then
            echo "::error::preflight (c): updater pubkey at $TAG differs from HEAD — the real N-1 cannot verify today's signatures (key rotated? fixture must move forward)"
            exit 1
          fi
          old_ep=$(jq -r '.plugins.updater.endpoints[0]' "$RUNNER_TEMP/n1-conf.json")
          if [ "$old_ep" != "https://aztec-accelerator.dev/releases/latest.json" ]; then
            echo "::error::preflight (d): N-1's updater endpoint is '$old_ep', not the impersonated https://aztec-accelerator.dev/releases/latest.json"
            exit 1
          fi
          echo "preflight OK: $TAG asset present, $N_VERSION > $N1_VERSION, pubkey + endpoint unchanged"

      - name: Updater smoke (install real N-1 → auto-update to the prod-signed N → assert /health == N)
        shell: pwsh
        env:
          UPDATER_SMOKE_MODE: ${{ inputs.mode }}
          # PROD key for the manifest signature (the real N-1 embeds the prod pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $n1 = Get-ChildItem -Path "$env:RUNNER_TEMP\n1" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $n1) { Write-Error "N-1 installer not found"; exit 1 }
          # Guard a no-op pass: N-1 must differ from N (the release version).
          if ($env:N1_VERSION -eq $env:N_VERSION) { Write-Error "N-1 == N ($env:N_VERSION) — a no-op update would pass trivially"; exit 1 }
          & packages/accelerator/scripts/updater-smoke-windows.ps1 `
            -NVersion $env:N_VERSION `
            -NArtifactsDir "$env:RUNNER_TEMP\n" `
            -N1Installer $n1.FullName `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -N1Version $env:N1_VERSION

      - name: Result summary
        if: success()
        run: echo "✅ Windows updater smoke PASSED ($env:SMOKE_MODE) — real N-1 ($env:N1_VERSION) auto-updated to the PROD-SIGNED N ($env:N_VERSION)." >> $env:GITHUB_STEP_SUMMARY
