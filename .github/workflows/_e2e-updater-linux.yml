name: _Updater Smoke Linux (reusable)

# Release-blocking Linux/AppImage sibling of _e2e-updater.yml. Installs the resolver-selected
# lower same-key (N-1) AppImage, lets it auto-update to the just-built+signed build (N)
# via a local feed impersonating the prod endpoint, and asserts it relaunches
# reporting version N. Answers the open `v1Compatible` question: does Tauri's
# Linux updater actually applies a RAW .AppImage in place. A red job blocks the
# draft release through `release.needs`.
#
# Needs no signing key: it serves the already-prod-signed N .AppImage and N-1
# validates it against its embedded pubkey. See updater-smoke-linux.sh.

on:
  workflow_call:
    inputs:
      n-version:
        description: The version being released (N)
        required: true
        type: string
      n-artifact:
        description: This run's Linux build artifact name (accelerator-linux-x86_64)
        required: false
        default: accelerator-linux-x86_64
        type: string
      n1-tag:
        description: Resolver-selected real published release tag below N
        required: true
        type: string
      n1-version:
        description: Version carried by the resolver-selected N-1 release
        required: true
        type: string
      platform-key:
        description: Tauri updater platform key
        required: false
        default: linux-x86_64
        type: string
      n1-appimage-glob:
        description: Glob for the N-1 release AppImage asset
        required: false
        default: "*Linux-x86_64.AppImage"
        type: string
      mode:
        description: "positive (expect the update to apply) | negative (serve a tampered AppImage, expect rejection)"
        required: false
        default: positive
        type: string
jobs:
  updater-smoke-linux:
    name: Updater Smoke Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # FUSE (AppImage runtime) + headless display + tray host + dbus. Running the
      # AppImage natively (via FUSE) sets $APPIMAGE, which the Tauri Linux updater
      # replaces in place — `--appimage-extract-and-run` would NOT, breaking the
      # swap path under test. libfuse2 is `libfuse2t64` on 24.04 (ubuntu-latest).
      - name: Install FUSE + GUI runtime + display + tray deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          # GUI runtime libs the AppImage needs at launch (libEGL/libGL come in via
          # the gtk/webkit stack). This is the SAME set setup-accelerator installs
          # for the Linux WebDriver job — which is why that job's app launches
          # headlessly. Without them the AppImage dies on
          # `libEGL.so.1: cannot open shared object file` before it can update.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev
          sudo apt-get install -y xvfb stalonetray dbus-x11

      - name: Setup display
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          eval "$(dbus-launch --sh-syntax)"
          stalonetray -d none --geometry 1x1+0+0 --kludges force_icons_size &
          sleep 1
          {
            echo "DISPLAY=:99"
            echo "NO_AT_BRIDGE=1"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
            echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID"
          } >> "$GITHUB_ENV"

      - name: Download N artifacts (this run)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.n-artifact }}
          path: n-artifacts

      - name: Download resolver-selected N-1 AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N_VERSION: ${{ inputs.n-version }}
          N1_TAG: ${{ inputs.n1-tag }}
          N1_VERSION: ${{ inputs.n1-version }}
        run: |
          if [ "$N1_TAG" != "accelerator-v$N1_VERSION" ]; then
            echo "::error::resolver output is inconsistent: tag=$N1_TAG version=$N1_VERSION"
            exit 1
          fi
          echo "N-1 = $N1_TAG"
          # Guard against a no-op pass: if N-1 resolves to the SAME version under
          # test, the updater has nothing to do and /health == N passes trivially.
          # Exact tag compare (tags are `accelerator-v<version>`).
          if [ "$N1_TAG" = "accelerator-v$N_VERSION" ]; then
            echo "::error::N-1 ($N1_TAG) is the version under test (accelerator-v$N_VERSION) — no-op no-update would pass trivially. Aborting."
            exit 1
          fi
          # Retry the N-1 asset download: GitHub's release-asset CDN throttles/errors transiently (the
          # 2026-08-17 incident hit it at ~50%, failing THIS unretried step on 3 straight RC dispatches).
          # `gh release download` streams to the final path with O_TRUNC and verifies neither length nor
          # digest — a transport error exits non-zero (→ retry) but a premature "clean" close could exit 0
          # with a truncated file, so each success is integrity-checked against the asset's API sha256 digest
          # (exact byte size as fallback for a release without one). 5 attempts, linear backoff; partials
          # cleared between tries. bash runs -eo pipefail by default, so every branch uses if/then/fi.
          for attempt in 1 2 3 4 5; do
            rm -rf n1; mkdir -p n1
            ok=""
            if gh release download "$N1_TAG" --pattern "${{ inputs.n1-appimage-glob }}" --dir n1; then
              f=$(find n1 -type f | head -1); bn=$(basename "${f:-x}")
              want=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$N1_TAG" --jq ".assets[]|select(.name==\"$bn\")|.digest // empty" 2>/dev/null || true)
              if [ -n "$f" ] && [ -n "$want" ]; then
                if [ "sha256:$(shasum -a 256 "$f" | cut -d' ' -f1)" = "$want" ]; then ok=1; fi
              elif [ -n "$f" ]; then
                sz=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$N1_TAG" --jq ".assets[]|select(.name==\"$bn\")|.size" 2>/dev/null || true)
                if [ -n "$sz" ] && [ "$(wc -c < "$f" | tr -d ' ')" = "$sz" ]; then ok=1; fi
              fi
            fi
            if [ -n "$ok" ]; then break; fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::N-1 download failed or failed integrity after 5 attempts (file='${f:-}')"
              exit 1
            fi
            echo "::warning::N-1 download attempt $attempt not OK; retrying in $((attempt * 10))s"
            sleep "$((attempt * 10))"
          done

      # BLOCKING: this job is in release-accelerator.yml's `tag.needs` /
      # `release.needs`, so a failure here fails the job → blocks the release.
      # Validated green on a 1.0.3-rc dry-run before the flip. To revert to
      # advisory: restore `continue-on-error` here + drop the job from tag/release
      # `needs`. The script's own ::error:: (and the FUSE-vs-updater-reject log
      # disambiguation) explain any failure.
      - name: Updater smoke (install N-1 → auto-update to N → assert /health == N)
        env:
          UPDATER_SMOKE_MODE: ${{ inputs.mode }}
        run: |
          APPIMAGE=$(find n1 -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then echo "::error::N-1 AppImage not found"; exit 1; fi
          bash packages/accelerator/scripts/updater-smoke-linux.sh \
            "${{ inputs.n-version }}" \
            "${{ inputs.platform-key }}" \
            n-artifacts \
            "$APPIMAGE" \
            "$GITHUB_WORKSPACE"

      - name: Result summary
        if: success()
        run: echo "✅ Linux AppImage updater smoke PASSED — Tauri applied the raw .AppImage and relaunched on N." >> "$GITHUB_STEP_SUMMARY"
