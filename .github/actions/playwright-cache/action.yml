name: Playwright cache
description: >
  Restore (and, in the warm-on-main job, save) the Playwright headless-shell
  browser cache, then ensure the browser + system deps are present. Keyed on the
  resolved Playwright version so the cache survives lockfile churn. Linux/ubuntu
  only (uses `--with-deps`, the ~/.cache/ms-playwright path, and GNU `timeout`).

inputs:
  save:
    description: "Save the cache after a miss. Use 'true' ONLY in the warm-on-main job; PR jobs restore-only so a PR cannot poison the shared cache."
    required: false
    default: "false"
  package-dir:
    description: >
      Workspace package whose Playwright pin governs (e.g. packages/playground). Every bunx here
      runs from this directory: the isolated linker keeps workspace deps OUT of the root
      node_modules, and a root-context bunx silently FETCHES a remote playwright whose version
      (and browser revision) can differ from the one the tests run.
    required: false
    default: "packages/playground"

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: pw
      shell: bash
      working-directory: ${{ inputs.package-dir }}
      run: |
        set -euo pipefail
        # Exact installed version from the CONSUMING package's own graph — every caller runs
        # `bun install` before this composite. `|| true` keeps a no-match from being swallowed
        # by `set -e` so it reaches our explicit error below.
        v=$(bunx playwright --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
        if [ -z "$v" ]; then
          echo "::error::could not resolve Playwright version — is 'bun install' run before this action?"
          exit 1
        fi
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "Playwright version: $v"

    - name: Restore Playwright browser cache
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-shell
        # Fall back to the latest browser cache for this OS if the exact version
        # key misses (e.g. right after a Playwright bump, before the warm job
        # reruns) — still avoids a cold CDN download in most cases.
        restore-keys: |
          ${{ runner.os }}-playwright-

    # System deps (apt). Historically reliable, but a runner apt/mirror stall once let a single
    # `timeout 300` expired repeatedly during a runner apt/mirror stall — same shape as
    # the CDN hang below, same remedy: kill a stalled attempt and retry. CAVEAT learned
    # the hard way that day: `timeout` kills only the node wrapper; the spawned `apt-get`
    # survives, keeps the dpkg/lists lock, and every retry then dies instantly with
    # "Could not get lock … held by process <pid> (apt-get)". So between attempts, reap
    # the orphaned apt/dpkg (this job owns the whole ephemeral VM) and repair dpkg state.
    - name: Install Playwright system deps
      shell: bash
      working-directory: ${{ inputs.package-dir }}
      run: |
        for i in 1 2 3; do
          if timeout 180 bunx playwright install-deps chromium; then exit 0; fi
          echo "::warning::playwright install-deps attempt $i stalled/failed; reaping orphaned apt and retrying"
          sudo pkill -9 apt-get 2>/dev/null || true
          sudo pkill -9 dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
          sudo dpkg --configure -a || true
          sleep 15
        done
        echo "::error::playwright install-deps failed after 3 attempts"
        exit 1

    - name: Install Playwright browser (headless shell)
      shell: bash
      working-directory: ${{ inputs.package-dir }}
      run: |
        # The ~111 MB headless-shell bytes arrive in <1s, but cdn.playwright.dev
        # intermittently HANGS at 100% (post-download) for many minutes. A long
        # timeout just waits on the stuck connection (observed: 100% then ~10 min
        # of silence → kill). So kill a hang FAST and RETRY with a fresh
        # connection — other jobs in the same run download fine, so a retry
        # usually catches a good edge. On a cache hit `playwright install` finds
        # the browser and skips the download (this loop exits on attempt 1).
        for i in 1 2 3 4 5 6 7 8; do
          if timeout 150 bunx playwright install --only-shell chromium; then exit 0; fi
          echo "::warning::playwright browser install attempt $i hung/failed; retrying with a fresh connection"
          sleep 10
        done
        echo "::error::playwright browser install failed after 8 attempts"
        exit 1

    - name: Save Playwright browser cache
      # Save on ANY cache miss. GitHub scopes a pull_request job's cache save to
      # that PR's own merge ref — it CANNOT poison `main` or other PRs (only the
      # warm-on-main job writes the shared main-scope cache). Saving here is
      # therefore safe AND self-healing: a PR's fast jobs (Mocked/Desktop, which
      # download cleanly) seed the PR-scoped cache that its slower, setup-heavy
      # job (Local Network E2E — ~5 min of setup-aztec before this step) then
      # RESTORES in the same run, sidestepping the CDN-hang on bad-routing
      # runners. The `save` input is retained for clarity but no longer gates.
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-shell
