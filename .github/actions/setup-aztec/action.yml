name: Setup Aztec
description: Install Bun, Foundry, and Aztec CLI. Version auto-detected from packages/sdk/package.json.

inputs:
  skip_cli:
    description: Skip Foundry + Aztec CLI install (use when targeting a remote Aztec node)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - run: bun install --frozen-lockfile
      shell: bash

    - name: Detect Aztec version
      if: inputs.skip_cli != 'true'
      id: detect
      shell: bash
      run: |
        VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('packages/sdk/package.json','utf8')).devDependencies['@aztec/aztec.js'])")
        echo "Aztec version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install Node.js 24
      if: inputs.skip_cli != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.18.0

    - name: Install Foundry
      if: inputs.skip_cli != 'true'
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        # Pinned, not "stable": aztec's L1 deploy wrapper (l1-contracts/scripts/forge_broadcast.js,
        # since 4.3.1) passes `--batch-size` WITHOUT `--batch`; foundry 1.7 made `--batch-size`
        # require the new `--batch` flag, so a floating stable (1.7.1) fails the deploy with
        # "required arguments were not provided: --batch". v1.4.1 is the lineage aztec bundles and
        # tests against. Revisit when aztec's wrapper supports the 1.7 CLI.
        version: v1.4.1

    - name: Cache Aztec CLI
      if: inputs.skip_cli != 'true'
      id: cache-aztec
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.aztec/versions/${{ steps.detect.outputs.version }}
        # The `-minage7` salt is load-bearing, not decoration. The aztec version alone does NOT
        # identify the tree: the installer resolves transitive dependencies unlocked, so the same
        # version installed on two days can differ — which is how `snappy@7.4.0` got in. Once a broken
        # tree is cached, the install step is skipped by its `cache-hit` guard and any fix applied
        # THERE never runs; the cache just keeps serving the breakage. Bump this salt whenever the
        # install recipe changes so the remedy is actually exercised.
        key: ${{ runner.os }}-aztec-${{ steps.detect.outputs.version }}-minage7-npm12-aztecexempt-allowscripts6-cpl

    - name: Install Aztec CLI
      if: inputs.skip_cli != 'true' && steps.cache-aztec.outputs.cache-hit != 'true'
      shell: bash
      run: |
        export CI=1
        export FOUNDRY_DIR="$HOME/.foundry"
        # Extend this repo's 7-day release quarantine to the aztec installer's OWN npm resolution.
        #
        # `bunfig.toml`'s `minimumReleaseAge` governs our dependencies; the installer runs its own
        # unlocked `npm install @aztec/...`, so nothing was quarantining ITS transitive tree. Aztec
        # depends on `snappy: ^7.2.2` with no lockfile, so a fresh install takes whatever is newest.
        #
        # That is not hypothetical: `snappy@7.4.0` was published 2026-08-12T13:36Z and cannot load its
        # native binding, which broke `aztec start` on 5.0.1 AND 5.1.0 simultaneously, with no change
        # on our side. The surfaced error is a red herring — it names `@napi-rs/snappy-wasm32-wasi`,
        # which is CORRECTLY absent on linux-x64 (`cpu: ["wasm32"]`); the loader only mentions it while
        # falling back after the native binding fails. Installing the wasm package by hand just
        # advances into the broken WASI path (`this.bridge.setLastError is not a function`).
        #
        # Seven days is the same window bunfig already applies, and it would have prevented this
        # outage. If a bad release ever survives past it, pin instead by pre-creating the version
        # directory's package.json with `{"overrides":{"snappy":"<good>"}}` before this runs.
        export npm_config_min_release_age=7
        # @aztec exemption (owner decision 2026-08-19): the quarantine above blocks even the
        # EXACT-pinned @aztec version being installed when it is <7 days old (verified: npm 11.16
        # ETARGETs a same-day release), which would hold every e2e leg red for a week after each
        # Aztec release. Mirror bunfig's owner-approved @aztec exemption here: first-party
        # exact-pinned packages skip the age gate; every third-party transitive (the snappy class
        # this quarantine exists for) keeps the full 7 days. `min-release-age-exclude` ships in
        # npm 12 (Node 24 bundles npm 11, which has no exclude in any form) — pin the upgrade.
        npm install -g npm@12.0.2
        export npm_config_min_release_age_exclude='@aztec/*'
        # npm 12 blocks dependency install scripts by default (allowScripts). Reviewed minimal
        # allowlist — exactly the six script-bearing packages in aztec 5.2.0's tree (npm <12 ran
        # ALL install scripts, so this is strictly narrower than the pre-upgrade behavior):
        # bcrypto is REQUIRED (plain node-gyp rebuild, no prebuilds — blocking it kills
        # `aztec start` with "Cannot find module 'bcrypto.node'"); the others
        # are prebuild-resolvers/postinstalls (leveldown, lmdb, msgpackr-extract, protobufjs,
        # unrs-resolver). Review this list when the blocked-packages warning names new entries.
        # Mechanism: a userconfig FILE, NOT the flag/env form — npm 12 rejects --allow-scripts on
        # project-scoped installs (EALLOWSCRIPTS; the installer uses `npm install --prefix`). A
        # step-scoped temp file (not $HOME/.npmrc) keeps the approvals from leaking into later job
        # steps or surviving on a non-ephemeral runner, and entries are VERSION-PINNED to the
        # reviewed identities (npm's recommendation): a future version bump of any of the six
        # fails closed with a named blocked-packages warning → re-review, update the pin here.
        NPMRC_ALLOW="$(mktemp)"
        trap 'rm -f "$NPMRC_ALLOW"' EXIT
        for p in bcrypto@5.5.2 leveldown@6.1.1 lmdb@3.5.6 msgpackr-extract@3.0.4 protobufjs@7.6.5 unrs-resolver@1.12.2; do
          echo "allow-scripts[]=$p" >> "$NPMRC_ALLOW"
        done
        export NPM_CONFIG_USERCONFIG="$NPMRC_ALLOW"
        # Patch the installer's foundry `mv` to a dereferencing copy:
        # foundryup was rewritten in Rust and now populates FOUNDRY_DIR/bin with SYMLINKS into
        # its versions/ store (activate_bin: std::os::unix::fs::symlink — verified in
        # foundry-rs/foundryup src/install.rs). The aztec installer's `mv "$temp/bin/$binary"`
        # therefore moves a symlink whose target it then `rm -rf`s with the temp dir, and
        # `install_native_symlinks` fails closed on the dangling link ("expected bundled binary
        # 'forge' missing"). `cp -L` dereferences at copy time, landing the real binary before
        # cleanup. Fail-open by design: if the pattern is gone, upstream changed the script
        # (possibly fixing this) — run it unpatched and let its own loud symlink check decide.
        # Remove when upstream handles current foundryup. Do NOT pre-seed internal-bin instead:
        # the installer's mv CLOBBERS seeded files with the doomed symlinks (proven on CI).
        INSTALL_SCRIPT="$(mktemp)"
        trap 'rm -f "$NPMRC_ALLOW" "$INSTALL_SCRIPT"' EXIT
        curl -fsSL "https://install.aztec.network/${{ steps.detect.outputs.version }}/install" -o "$INSTALL_SCRIPT"
        if grep -q 'mv "\$temp_foundry_dir/bin/\$binary"' "$INSTALL_SCRIPT"; then
          sed -i 's|mv "\$temp_foundry_dir/bin/\$binary"|cp -L "$temp_foundry_dir/bin/$binary"|' "$INSTALL_SCRIPT"
          echo "patched installer: foundry mv -> cp -L (foundryup symlink layout)"
        else
          echo "::warning::installer foundry-mv pattern not found — running unpatched (upstream changed; its symlink check will catch real breakage)"
        fi
        VERSION=${{ steps.detect.outputs.version }} bash "$INSTALL_SCRIPT"
        ls -la ~/.aztec/versions/${{ steps.detect.outputs.version }}/bin/

    # The installer can produce a tree whose `snappy` cannot resolve a platform binding, and the only
    # symptom is `aztec start` dying with ERR_MODULE_NOT_FOUND ~10 minutes later, at the node-readiness
    # timeout, with the real cause buried in a log dump. Verified deterministic on 5.0.1: two runs,
    # fresh installs both times ("Cache not found for input keys: Linux-aztec-5.0.1"), identical
    # failure. Detect it HERE, where the cause is obvious, and repair the one missing optional
    # dependency rather than letting every PR spend ten minutes discovering it.
    #
    # Deliberately loud, not silent: if the repair does not take, this fails the step with the reason
    # instead of handing the problem back to the E2E job.
    - name: Verify the Aztec CLI can load its native dependencies
      if: inputs.skip_cli != 'true'
      shell: bash
      run: |
        AZTEC_DIR="$HOME/.aztec/versions/${{ steps.detect.outputs.version }}"
        probe() { node -e 'import("snappy").then(()=>process.exit(0)).catch(e=>{console.error(String(e));process.exit(1)})' 2>&1; }
        cd "$AZTEC_DIR"
        if probe; then
          echo "aztec's snappy binding loads"
          exit 0
        fi
        # DIAGNOSE ONLY — deliberately no repair. Three were attempted and all failed:
        #   1. the bindings at `@latest` — resolved the module, then died on
        #      `this.bridge.setLastError is not a function` (a napi bridge only matches its own
        #      wrapper), and npm churned the tree doing it: "added 9 packages, removed 1 package".
        #   2. `@napi-rs/snappy-linux-x64-gnu` at snappy's DECLARED version — the wrong package; the
        #      loader names `wasm32-wasi` in its own error.
        #   3. every binding snappy declares, at its declared version — still failed.
        # Whatever is broken lives inside the upstream install (note its own "packages have install
        # scripts not yet covered by allowScripts" warning), and patching another project's dependency
        # tree from CI produced side effects without fixing it.
        #
        # The remaining fix is a VERSION BUMP, which is deliberately not done here: this repo bumps
        # @aztec through `aztec-stable.yml` (workflow_dispatch, `merge_mode: none` so the PR stays open
        # for review) precisely so a dependency bump is a reviewed decision rather than a side effect.
        # (At the time of that 2026-08 incident, `npm view @aztec/stdlib dist-tags` reported
        # latest = 5.1.0 against the then-pinned 5.0.1 — when triaging, compare dist-tags against the
        # CURRENT pin in packages/sdk/package.json, not those historical numbers.)
        #
        # What this step still earns: a ~2-minute failure naming the cause, instead of a 12-minute
        # "Aztec node failed to respond" timeout with ERR_MODULE_NOT_FOUND buried in a post-mortem log
        # dump.
        echo "::error::aztec ${{ steps.detect.outputs.version }} installed without a usable snappy binding, so \`aztec start\` cannot run. UPSTREAM packaging break, not a fault in this repository. Three in-CI repair attempts failed (see this step's comment). Fix by bumping @aztec via aztec-stable.yml — dist-tag latest is ahead of the pin — or wait for upstream."
        exit 1

    - name: Update PATH
      if: inputs.skip_cli != 'true'
      shell: bash
      run: |
        echo "$HOME/.aztec/versions/${{ steps.detect.outputs.version }}/bin" >> $GITHUB_PATH
        echo "$HOME/.aztec/versions/${{ steps.detect.outputs.version }}/node_modules/.bin" >> $GITHUB_PATH

    - name: Ensure foundry-toolchain forge wins over the aztec-bundled forge
      if: inputs.skip_cli != 'true'
      shell: bash
      run: |
        # The aztec bundle ships its own forge in versions/<v>/bin. Since aztec 4.3.1 the L1 deploy
        # path (l1-contracts/scripts/forge_broadcast.js) spawns bare `forge` with upstream-foundry
        # args, but the 4.3.1-bundled forge's `script` CLI is incompatible (requires `--batch`) —
        # the local network then fails L1 deploy and never comes up. The aztec bin dir was prepended
        # to PATH above (the CLI itself needs it), so neutralize just the bundled forge: the
        # foundry-toolchain forge (installed earlier in this action) must be the one that resolves.
        AZTEC_BIN="$HOME/.aztec/versions/${{ steps.detect.outputs.version }}/bin"
        if [ -x "$AZTEC_BIN/forge" ]; then
          mv "$AZTEC_BIN/forge" "$AZTEC_BIN/forge.aztec-bundled"
          echo "Renamed aztec-bundled forge out of the way: $AZTEC_BIN/forge.aztec-bundled"
        fi
        command -v forge >/dev/null || { echo "::error::no foundry-toolchain forge on PATH"; exit 1; }
        echo "forge now resolves to: $(command -v forge) ($(forge --version | head -1))"
