<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authorize Site</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="assets/authorize.js"></script>
</head>
<body>
  <div class="popup-container">
    <div class="popup-scroll">
      <h2>Can this site use Presto?</h2>
      <div class="popup-detail">
        <div id="recognized" class="recognized-row" hidden>
          <span class="recognized-name"></span>
          <svg class="verified-check" aria-label="Verified by Presto maintainers" role="img" viewBox="0 0 24 24">
            <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
          </svg>
        </div>
        <!-- F-014: the FULL canonical origin is shown as visible, selectable, keyboard-focusable text —
             never truncated (a truncation could hide the registrable domain and disguise a look-alike).
             dir=ltr + unicode-bidi isolation (CSS) prevent bidi visual reordering; punycode stays canonical
             (never decoded to Unicode homoglyphs). -->
        <div id="origin" class="origin-line" tabindex="0" dir="ltr" role="group" aria-label="Requesting origin"></div>
      </div>
      <!-- Approving is PERMANENT, so it has to say so. This line replaces the "Always allow this site"
           checkbox that used to carry that meaning: with a checkbox, ticking it WAS the disclosure and
           the notification; without one, an Allow would write to disk with nothing telling the user.
           That, not the re-prompt friction, is what F-014's opt-in actually bought — see
           implementations-plan/pre-release-polish/decision-allow-once.md.
           Deliberately does not promise the write succeeds: persisting is best-effort (core's
           authorize_origin warns and continues on a config-save error, so an approved proof is never
           failed by a disk problem). The failure mode is being asked again — safer than promised,
           never less safe. -->
      <p id="permanence" class="popup-note">Stays approved until you remove it in Settings.</p>
    </div>
    <div class="popup-buttons">
      <button class="btn btn-secondary" id="deny">Deny</button>
      <button class="btn btn-primary" id="allow">Allow</button>
    </div>
  </div>
</body>
</html>
