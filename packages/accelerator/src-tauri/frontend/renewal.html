<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate Renewal</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="renewal.css" />
    <script type="module" src="assets/renewal.js"></script>
  </head>
  <body class="scrollable">
    <div class="r">
      <h1>Time to renew your certificate</h1>
      <p>
        The local certificate that lets your browser reach Presto over HTTPS is about to expire.
        Renewing installs a fresh one; your system will ask you to confirm. If you skip, HTTPS keeps
        working until the certificate expires, and you'll be reminded again.
      </p>
      <div class="cta">
        <button type="button" class="primary" id="renew">Renew now</button>
        <button type="button" class="ghost" id="later">Later</button>
      </div>
    </div>
  </body>
</html>
