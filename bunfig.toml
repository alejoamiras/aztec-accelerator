# Supply-chain hardening. Refuse installing any dependency version published
# less than 7 days ago, so a freshly-published malicious release (e.g. a hijacked
# popular package — the May 2026 @tanstack worm compromised 42 packages within 6
# minutes of publish) is never pulled into a build during the window before the
# compromise is typically caught and yanked.
#
# Affects dependency RESOLUTION (bun add / bun update). Already-locked installs
# (`bun install --frozen-lockfile`, what CI runs) are unaffected — they install
# exactly what bun.lock pins.
[install]
# Isolated linker: packages materialize under node_modules/.bun instead of a hoisted
# copy-tree (~4x faster installs measured here; the shared download cache is unchanged and
# already CI-cached). Layout-sensitive consumers must resolve from their own package dir,
# never assume a hoisted root entry — packaged-e2e-swap-sdk.sh is the known such consumer.
linker = "isolated"
minimumReleaseAge = 604800 # 7 days, in seconds

# @aztec/* exemption (owner decision 2026-08-18): @aztec is this product's
# first-party upstream, versions are exact-pinned, and every bump lands as a human-reviewed PR —
# but Aztec releases are consumed same-day, inside the window above. Residual risk accepted: for
# these packages specifically there is no 7-day observation window; a compromised @aztec publish
# would not be age-filtered. Every other scope keeps the full quarantine.
#
# EXACT NAMES ONLY: a "@aztec/*" glob is silently ignored (verified empirically on 1.3.14 AND
# re-verified on 1.4.0 against a same-day nightly),
# and the age filter applies to transitive resolution too — so this list must cover the full
# resolved @aztec graph, not just package.json keys. Maintenance: a future @aztec bump that adds
# a new transitive will fail install with a named min-age error; add that name here (only ever
# @aztec/-scoped names) and prune entries that leave the lock.
minimumReleaseAgeExcludes = [
  "@aztec/accounts",
  "@aztec/aztec.js",
  "@aztec/bb.js",
  "@aztec/bb-prover",
  "@aztec/blob-lib",
  "@aztec/builder",
  "@aztec/constants",
  "@aztec/entrypoints",
  "@aztec/ethereum",
  "@aztec/foundation",
  "@aztec/key-store",
  "@aztec/kv-store",
  "@aztec/l1-artifacts",
  "@aztec/native",
  "@aztec/noir-acvm_js",
  "@aztec/noir-contracts.js",
  "@aztec/noir-noirc_abi",
  "@aztec/noir-noir_codegen",
  "@aztec/noir-protocol-circuits-types",
  "@aztec/noir-types",
  "@aztec/protocol-contracts",
  "@aztec/pxe",
  "@aztec/simulator",
  "@aztec/sqlite3mc-wasm",
  "@aztec/standard-contracts",
  "@aztec/stdlib",
  "@aztec/telemetry-client",
  "@aztec/viem",
  "@aztec/wallets",
  "@aztec/wallet-sdk",
  "@aztec/world-state",
]
